<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Azure Cove Villas</title>

  <link rel="stylesheet" href="style.css"/>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

  <!-- LOADER -->
  <div class="loader">
    <h1>Azure Cove Villas</h1>
  </div>

  <!-- FLOATING BUTTON -->
  <a href="#booking" class="floating-btn">Book Now</a>

  <!-- HEADER -->
  <header>

    <nav class="navbar">
      <div class="logo">Azure Cove</div>

      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#villas">Villas</a></li>
        <li><a href="#amenities">Amenities</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#booking">Booking</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

      <div class="hamburger">
        <i class="fa-solid fa-bars"></i>
      </div>
    </nav>

    <!-- HERO -->
    <section class="hero" id="home">
      <div class="overlay"></div>

      <div class="hero-content">
        <h1>Luxury Villas & Private Pools in the Philippines</h1>
        <p>Discover tropical paradise and unforgettable stays.</p>
        <a href="#booking" class="btn">Reserve Now</a>
      </div>
    </section>

  </header>

  <!-- SEARCH -->
  <section class="search-section">

    <h2>Find Your Perfect Villa</h2>

    <div class="filters">

      <input type="text" id="locationFilter" placeholder="Location">

      <select id="guestFilter">
        <option value="">Guests</option>
        <option value="2">2 Guests</option>
        <option value="4">4 Guests</option>
</html>
